    <!-- Estilo Visual do Botão da Rádio (Reduzido em 20%) -->
    <style>
      #radioWidget {
        position: fixed;
        top: 20px;       
        left: 20px;      
        z-index: 99999;  
        background: rgba(0, 0, 0, 0.75);
        border: 2px solid #fff;
        border-radius: 8px;
        padding: 8px 12px;
        display: flex;
        align-items: center;
        gap: 10px;
        box-shadow: 0px 4px 10px rgba(0,0,0,0.5);
        font-family: Arial, sans-serif;
        color: #fff;
        
        /* Reduz toda a interface em exatamente 20% */
        transform: scale(0.8);
        transform-origin: top left; 
      }
      #radioBtn {
        background: #0088ff;
        border: none;
        color: white;
        padding: 6px 12px;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
        font-size: 12px;
        transition: background 0.2s;
      }
      #radioBtn:hover {
        background: #0066cc;
      }
      #radioStatus {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        white-space: nowrap; /* Evita que o texto quebre linha com o tamanho menor */
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root" class="w-100 h-100"></div>
    <script>
      const NitroConfig = {
        "config.urls": [ 'renderer-config.json', 'ui-config.json' ],
        "sso.ticket": (new URLSearchParams(window.location.search).get('sso') || null),
        "forward.type": (new URLSearchParams(window.location.search).get('room') ? 2 : -1),
        "forward.id": (new URLSearchParams(window.location.search).get('room') || 0),
        "friend.id": (new URLSearchParams(window.location.search).get('friend') || 0),
      };
    </script>
    
    <!-- INTERFACE DA RÁDIO NO CLIENT -->
    <div id="radioWidget">
      <span id="radioStatus">Radio: Pausada</span>
      <button id="radioBtn" onclick="toggleRadio()">PLAY</button>
    </div>

    <!-- PLAYER AUDIO -->
    <audio id="habboRadio" loop preload="none">
        <source src="https://live.hunter.fm/pop_stream?ag=mp3" type="audio/mpeg">
        Seu navegador não suporta áudio.
    </audio>

    <!-- LOGICA DE PLAY / PAUSE E CONTORNO DE AUTOPLAY -->
    <script>
      var audio = document.getElementById('habboRadio');
      var btn = document.getElementById('radioBtn');
      var statusText = document.getElementById('radioStatus');

      function toggleRadio() {
          if (audio.paused) {
              audio.play().then(function() {
                  btn.innerText = "PAUSE";
                  btn.style.background = "#ff3333";
                  statusText.innerText = "Radio: Tocando";
              }).catch(function(error) {
                  console.log("Erro ao reproduzir rádio:", error);
              });
          } else {
              audio.pause();
              btn.innerText = "PLAY";
              btn.style.background = "#0088ff";
              statusText.innerText = "Radio: Pausada";
          }
      }

      // Ativação automática no primeiro clique na tela (caso o navegador permita)
      document.addEventListener('click', function() {
          if (audio.paused && btn.innerText === "PLAY") {
              toggleRadio();
          }
      }, { once: true });
    </script>
  </body>
