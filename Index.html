    <script>
      const ssoTicket = (new URLSearchParams(window.location.search).get('sso') || null);

      const NitroConfig = {
        "config.urls": [ 'renderer-config.json', 'ui-config.json' ],
        "sso.ticket": ssoTicket,
        "forward.type": (new URLSearchParams(window.location.search).get('room') ? 2 : -1),

    <!-- INTERFACE DA RÁDIO NO CLIENT -->

      <span id="radioStatus">Radio: Pausada</span>
      <button id="radioBtn" onclick="toggleRadio()">PLAY</button>

    <!-- PLAYER AUDIO -->
    <audio id="habboRadio" loop preload="none">
        <source src="https://live.hunter.fm/pop_stream?ag=mp3" type="audio/mpeg">
        Seu navegador não suporta áudio.
    </audio>

    <!-- LOGICA DE PLAY / PAUSE E CONTORNO DE AUTOPLAY -->
    <script>
      var audio = document.getElementById('habboRadio');
      var btn = document.getElementById('radioBtn');
      var statusText = document.getElementById('radioStatus');

      function toggleRadio() {
          if (audio.paused) {
              audio.play().then(function() {
                  btn.innerText = "PAUSE";
                  btn.style.background = "#ff3333";
                  statusText.innerText = "Radio: Tocando";
              }).catch(function(error) {
                  console.log("Erro ao reproduzir rádio:", error);
              });
          } else {
              audio.pause();
              btn.innerText = "PLAY";
              btn.style.background = "#0088ff";
              statusText.innerText = "Radio: Pausada";
          }
      }

      document.addEventListener('click', function() {
          if (audio.paused && btn.innerText === "PLAY") {
              toggleRadio();
          }
      }, { once: true });
    </script>

    
<!-- SCRIPTS DO YOUTUBE OVERLAY -->
<script src="/youtube-overlay/js/chunk-vendors.e3117a63.js"></script>
<script src="/youtube-overlay/js/app.d6ff1731.js"></script>

<script>
    const ytWsUrl = "wss://ws.virtualboost.online:2096";

    let playerFechadoPeloUsuario = false;
    let ultimoVideoId = null;
    let iframeAnterior = null;

    // Inicializa o overlay
    if (typeof window.startYTOverlay === 'function') {
        window.startYTOverlay(ssoTicket, ytWsUrl);
    }

    // Botão de fechar
    const closeYtBtn = document.createElement('button');
    closeYtBtn.id = 'closeYtBtn';
    closeYtBtn.innerText = 'X';
    closeYtBtn.title = 'Fechar vídeo';
    document.body.appendChild(closeYtBtn);

    const appContainer = document.getElementById('app');

    // Fecha e interrompe completamente o vídeo
    

function fecharYoutube() {
    playerFechadoPeloUsuario = true;

    const iframes = document.querySelectorAll('#app iframe');

    iframes.forEach(function(iframe) {
        try {
            // Solicita a parada completa do vídeo
            iframe.contentWindow.postMessage(
                JSON.stringify({
                    event: 'command',
                    func: 'stopVideo',
                    args: []
                }),
                '*'
            );

            // Reforça a pausa
            iframe.contentWindow.postMessage(
                JSON.stringify({
                    event: 'command',
                    func: 'pauseVideo',
                    args: []
                }),
                '*'
            );
        } catch (e) {
            console.log('Erro ao parar YouTube:', e);
        }
    });

    // Esconde o player
    if (appContainer) {
        appContainer.style.display = 'none';
    }

    closeYtBtn.style.display = 'none';

    // Não remove o iframe: preserva o estado do overlay.
}


    // Não remove o iframe nem altera o estado interno do overlay.

    closeYtBtn.onclick = function(e) {
        e.preventDefault();
        e.stopPropagation();
        fecharYoutube();
    };

    // Detecta quando um novo iframe é criado pelo overlay
    
    function verificarPlayer() {
        const iframe = document.querySelector('#app iframe');

        if (!iframe || !appContainer) {
            closeYtBtn.style.display = 'none';
            return;
        }

        // Atualiza a referência do iframe sem reabrir o player
        if (iframe !== iframeAnterior) {
            iframeAnterior = iframe;
        }

        // Se o usuário fechou, mantém tudo escondido
        if (playerFechadoPeloUsuario || appContainer.style.display === 'none') {
            closeYtBtn.style.display = 'none';
            return;
        }

        const rect = iframe.getBoundingClientRect();

        if (rect.width > 0 && rect.height > 0) {
            closeYtBtn.style.display = 'flex';
            closeYtBtn.style.top = (rect.top - 26) + 'px';
            closeYtBtn.style.left = (rect.right - 28) + 'px';
        } else {
            closeYtBtn.style.display = 'none';
        }
    }

    // Monitora o player
    setInterval(verificarPlayer, 300);

    // Quando chegar um novo vídeo pelo comando, libera a abertura novamente
    
    window.addEventListener('message', function(event) {
        if (!event.origin || !event.origin.includes('youtube.com')) return;
        if (typeof event.data !== 'string') return;

        try {
            const dados = JSON.parse(event.data);

            // 1 = vídeo começou a reproduzir
            if (dados.info && dados.info.playerState === 1) {
                // Libera novamente o player para um novo vídeo
                playerFechadoPeloUsuario = false;

                if (appContainer) {
                    appContainer.style.display = 'block';
                }

                // Atualiza o botão X
                setTimeout(verificarPlayer, 100);
            }
        } catch (e) {}
    });
</script>
