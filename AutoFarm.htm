<html noscrollbar>
<title>Auto Farm [Virtual Boost]</title>
<body>
<center>

<table width=235 border=1 cellpadding=2 cellspacing=0 bgcolor="000000">
<tr>
<td align=center background="L2font-e.map_airship_harbor_gludio">

<font color="FFFFFF" size=3><b>AUTO FARM</b></font>
<br>
<font color="AAAAAA" size=1>VIRTUAL BOOST</font>
<br>
<font color="AAAAAA" size=1>Status:</font>
<font color="3ADF00" size=1><b>%status%</b></font>

<br>

<table width=220 border=1 cellpadding=2 cellspacing=1 bgcolor="000000">
<tr>

<td align=center width=110 bgcolor="202020">
<font color="AAAAAA" size=1>RAIO</font>
<br>
<font color="FFFFFF" size=1><b>%radius%</b></font>
<br>
<button value="ALTERAR"
action="bypass _bbsscripts;l2f.gameserver.autofarm.AutoFarmCommunity:radius"
width=60 height=18
back="L2UI_CT1.Button_DF"
fore="L2UI_CT1.Button_DF_Down">
</td>

<td align=center width=110 bgcolor="202020">
<font color="AAAAAA" size=1>POÇÃO</font>
<br>
<font color="FFFFFF" size=1><b>%potion%</b></font>
<br>
<button value="ALTERAR"
action="bypass _bbsscripts;l2f.gameserver.autofarm.AutoFarmCommunity:potion"
width=60 height=18
back="L2UI_CT1.Button_DF"
fore="L2UI_CT1.Button_DF_Down">
</td>

</tr>
</table>

<br>

<table width=220 border=1 cellpadding=2 cellspacing=1 bgcolor="000000">
<tr>

<td align=center width=73 height=42 bgcolor="202020">
<button value="%skill1value%"
action="bypass _bbsscripts;l2f.gameserver.autofarm.AutoFarmCommunity:skill1"
width=36 height=36
back="%skill1icon%"
fore="%skill1icon%"
tooltip="%skill1name%">
</td>

<td align=center width=73 height=42 bgcolor="202020">
<button value="%skill2value%"
action="bypass _bbsscripts;l2f.gameserver.autofarm.AutoFarmCommunity:skill2"
width=36 height=36
back="%skill2icon%"
fore="%skill2icon%"
tooltip="%skill2name%">
</td>

<td align=center width=73 height=42 bgcolor="202020">
<button value="%skill3value%"
action="bypass _bbsscripts;l2f.gameserver.autofarm.AutoFarmCommunity:skill3"
width=36 height=36
back="%skill3icon%"
fore="%skill3icon%"
tooltip="%skill3name%">
</td>

</tr>
</table>

<br>

<table width=220 border=1 cellpadding=2 cellspacing=1 bgcolor="000000">
<tr>

<td align=center bgcolor="202020">
<button value="LIGAR"
action="bypass _bbsscripts;l2f.gameserver.autofarm.AutoFarmCommunity:start"
width=95 height=20
back="L2UI_CT1.Button_DF"
fore="L2UI_CT1.Button_DF_Down">
</td>

<td align=center bgcolor="202020">
<button value="DESLIGAR"
action="bypass _bbsscripts;l2f.gameserver.autofarm.AutoFarmCommunity:stop"
width=95 height=20
back="L2UI_CT1.Button_DF"
fore="L2UI_CT1.Button_DF_Down">
</td>

</tr>
</table>

<br>

<button value="FECHAR"
action="bypass _bbhome"
width=65 height=18
back="L2UI_CT1.Button_DF"
fore="L2UI_CT1.Button_DF_Down">

</td>
</tr>
</table>

</center>
</body>
</html>
